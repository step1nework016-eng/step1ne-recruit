<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step1ne Pre-call Card v2.1｜順序流程版</title>
<style>
:root{
  --bg:#eef3f8;--panel:#fff;--line:#dfe6ef;--text:#172033;--muted:#6d788c;
  --navy:#14243c;--blue:#2768df;--soft:#f7fbff;--green:#eef8f1;--yellow:#fff8e8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
.wrap{max-width:1160px;margin:28px auto;padding:0 18px}
.app{background:#fff;border:1px solid #d8e1ec;border-radius:22px;box-shadow:0 18px 45px rgba(24,36,56,.12);overflow:hidden}
.tabs{display:flex;gap:32px;padding:18px 28px 0;border-bottom:1px solid var(--line);font-weight:850;color:#818a9b}
.tabs .active{color:var(--blue);padding-bottom:15px;border-bottom:3px solid var(--blue)}
.main{padding:24px 28px 34px}

.demo-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.demo-switch button{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-weight:800;color:#49566c;cursor:pointer}
.demo-switch button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.candidate{background:var(--soft);border:1px solid #cfe0f7;border-radius:18px;padding:18px}
.candidate h1{font-size:28px;margin:0 0 11px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #d8e2ee;border-radius:999px;padding:8px 12px;font-weight:700;color:#3d4960}

.goal{margin-top:14px;background:var(--navy);color:#fff;border-radius:18px;padding:20px 23px}
.goal .label{font-weight:900;color:#cbd6e6;font-size:14px}
.goal h2{font-size:23px;margin:7px 0;line-height:1.45}
.goal p{margin:0;color:#c4cede;line-height:1.55}
.jobline{display:flex;gap:16px;flex-wrap:wrap;margin:13px 3px 0;color:#657188;font-weight:700}

.flow-title{display:flex;align-items:center;gap:12px;margin:25px 0 13px}
.flow-title h3{margin:0;font-size:18px}
.flow-title .line{height:1px;background:var(--line);flex:1}
.flow-title small{color:var(--muted);font-weight:750}

.flow{
  display:grid;
  grid-template-columns:1fr 52px 1fr;
  gap:14px 0;
  align-items:stretch;
}
.step{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;min-height:160px}
.step-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e7ecf2;font-weight:900}
.num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:14px;flex:none}
.step-body{padding:14px 16px}
.arrow{display:grid;place-items:center;color:#a0aaba;font-size:26px;font-weight:900}
.row-arrow{grid-column:1 / 4;height:25px;display:grid;place-items:center;color:#a0aaba;font-size:25px}
.known{display:flex;gap:7px;flex-wrap:wrap}
.known span{background:var(--green);border:1px solid #d1ead9;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:750}
.script{font-size:15px;line-height:1.65;color:#344157}
.quote{background:#f7f9fc;border-left:4px solid var(--blue);padding:11px 12px;border-radius:0 10px 10px 0;font-weight:750;line-height:1.6}
.q{border:1px solid #e2e8ef;border-radius:12px;padding:11px 12px;margin-bottom:9px}
.q:last-child{margin-bottom:0}
.q .title{font-weight:900;font-size:14px}.q .text{font-weight:800;line-height:1.5;margin-top:5px}
.q small{display:block;margin-top:5px;color:var(--muted)}
details{margin-top:8px;background:#f7f9fc;border-radius:9px;padding:8px 9px}
summary{cursor:pointer;font-weight:800;color:#506078}
.mini{padding:9px 10px;background:#fafbfd;border:1px solid #e6ebf1;border-radius:10px;margin-bottom:7px}
.mini:last-child{margin-bottom:0}.mini b{display:block;font-size:14px}.mini small{color:var(--muted)}
.closebox{background:#eef5ff;border:1px solid #cfe0f7;border-radius:12px;padding:12px;line-height:1.65;font-weight:750}

.tools{margin-top:24px;padding-top:20px;border-top:2px dashed #dce4ee}
.tools-title{font-size:17px;font-weight:900;margin-bottom:12px;color:#515e72}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tool{border:1px solid var(--line);border-radius:15px;overflow:hidden}
.tool.dark{background:#101d31;color:#fff;border:none}
.tool-head{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:900}
.tool.dark .tool-head{border-color:rgba(255,255,255,.12)}
.tool-body{padding:13px 15px}
.phone-item{background:rgba(255,255,255,.08);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-weight:800}
.warn{background:var(--yellow)}
.badge{margin-left:auto;background:#eef2f7;color:#657086;padding:5px 8px;border-radius:999px;font-size:11px}
.note{margin-top:18px;text-align:center;color:#7b8799;font-size:13px}

@media(max-width:850px){
 .main{padding:18px}
 .flow{grid-template-columns:1fr}
 .arrow,.row-arrow{display:none}
 .toolgrid{grid-template-columns:1fr}
 .candidate h1{font-size:24px}
 .goal h2{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
  <div class="tabs"><div class="active">電洽前準備</div><div>職缺介紹</div></div>
  <div class="main">
    <div class="demo-switch">
      <button class="on" data-role="finance">財會</button>
      <button data-role="engineer">工程</button>
      <button data-role="safety">職安</button>
    </div>

    <section class="candidate">
      <h1 id="name"></h1>
      <div class="chips" id="chips"></div>
    </section>

    <section class="goal">
      <div class="label">🎯 這通電話只要確認</div>
      <h2 id="goal"></h2>
      <p id="reason"></p>
    </section>

    <div class="jobline" id="jobline"></div>

    <div class="flow-title">
      <h3>☎️ 建議電洽順序</h3>
      <div class="line"></div>
      <small>左 → 右｜上 → 下</small>
    </div>

    <div class="flow">
      <section class="step">
        <div class="step-head"><span class="num">1</span><span>開場＋設定這通目的</span></div>
        <div class="step-body">
          <div class="quote" id="opening"></div>
        </div>
      </section>
      <div class="arrow">→</div>
      <section class="step">
        <div class="step-head"><span class="num">2</span><span>已經知道，不要重問</span></div>
        <div class="step-body"><div class="known" id="known"></div></div>
      </section>

      <div class="row-arrow">↓</div>

      <section class="step">
        <div class="step-head"><span class="num">3</span><span>Top 3｜先問最重要的</span><span class="badge">必問</span></div>
        <div class="step-body" id="top"></div>
      </section>
      <div class="arrow">→</div>
      <section class="step">
        <div class="step-head"><span class="num">4</span><span>補問｜有時間再確認</span></div>
        <div class="step-body" id="extra"></div>
      </section>

      <div class="row-arrow">↓</div>

      <section class="step">
        <div class="step-head"><span class="num">5</span><span>60 秒介紹職缺</span></div>
        <div class="step-body">
          <div class="script" id="pitch"></div>
        </div>
      </section>
      <div class="arrow">→</div>
      <section class="step">
        <div class="step-head"><span class="num">6</span><span>薪資／地點／條件</span></div>
        <div class="step-body" id="conditions"></div>
      </section>

      <div class="row-arrow">↓</div>

      <section class="step" style="grid-column:1 / 4">
        <div class="step-head"><span class="num">7</span><span>收尾｜確認意願與下一步</span></div>
        <div class="step-body"><div class="closebox" id="close"></div></div>
      </section>
    </div>

    <div class="tools">
      <div class="tools-title">🧰 輔助工具｜不是流程步驟</div>
      <div class="toolgrid">
        <section class="tool dark">
          <div class="tool-head">☎️ 電話旁超短版</div>
          <div class="tool-body" id="phone"></div>
        </section>
        <section class="tool warn">
          <div class="tool-head">⚠️ 顧問注意＋AI 判斷</div>
          <div class="tool-body">
            <div class="script" id="flag"></div>
            <details>
              <summary>展開 Hard Gate / Evidence</summary>
              <div class="script" id="evidence"></div>
            </details>
          </div>
        </section>
      </div>
    </div>

    <div class="note">主流程只有 1 → 7；電話旁模式與 AI 判斷都降級為輔助工具。</div>
  </div>
</div>
</div>

<script>
const DATA={
finance:{
 name:"劉柔諍",
 chips:["QUT｜Finance","約 3 年財會","海外帳務：菲／越／美","目前待業，可隨時到職"],
 goal:"確認 Project Controller 能力缺口＋薪資＋意願",
 reason:"Accounting 基礎完整，不重問海外帳務與月結；主要補 Budget、Cash Flow、跨法人整合與 Reporting。",
 job:["日本項目財務會計","💰 55K 起，可面議","📍 台北敦化南路","🧭 Project Controller 發展"],
 opening:"「我有完整看過你跟阿財前面的面談內容，所以離職原因、海外帳務、RPA、月結這些我就不重新問了。今天主要補幾個跟這個職缺比較有差異的能力，大概抓 8～10 分鐘。」",
 known:["離職原因","Gap","海外帳務","RPA","月結／稅務／AR","可隨時到職"],
 top:[
  ["薪資","下一份工作目前期待多少？","追：希望值還是最低接受範圍？"],
  ["Budget vs. Actual","過去有沒有做過預算跟實際花費的差異分析？","追：成本預估、費用分析或 Forecast 呢？"],
  ["Cash Flow","有沒有做過現金流、資金需求或未來付款時程預估？","追：付款安排、銀行帳戶管理呢？"]
 ],
 extra:[["跨法人整合","有沒有整合不同國家／公司財務資料？"],["Management Reporting","月結後會不會整理差異、風險給主管？"],["環境彈性","能接受流程仍在成長、一起建立制度嗎？"]],
 pitch:"這個角色除了日本公司的日常帳務與月結，還會往 Project Cost、Budget vs. Actual、Cash Flow、付款需求與不同法人財務整合延伸。當地稅務有會計師或稅理士支援，不是要你自己精通每個國家的稅法。",
 conditions:[["薪資","55K 起，可面議"],["年薪","約 13 個月＋三節"],["地點","台北市敦化南路二段"],["發展","Accounting → Project Controller"]],
 close:"「以現在你聽到的工作內容、薪資跟地點，如果下一步是從一般財會往 Project Controller 發展，你有意願安排下一步面試嗎？」",
 phone:["① 薪資","② Budget vs. Actual","③ Cash Flow","④ 跨法人整合／Reporting","⑤ 環境彈性","⑥ 最後確認意願"],
 flag:"海外帳務已經確認，不要再問「有沒有海外經驗」；真正要確認的是跨法人整合與分析深度。",
 evidence:"核心 Gate：Project Budget、Cash Flow、跨法人 Reporting、薪資與環境接受度。已知月結／海外帳務不應重複追問。"
},
engineer:{
 name:"劉奎佑",
 chips:["9–10 年工地／工務現場管理","近期半導體廠工程師 2 個月","建築／機電包商協調","來源：line_click"],
 goal:"確認調派意願＋學歷科系＋半導體專案責任深度",
 reason:"現場與協調經驗已知，但外縣市調派、科系與半導體專案責任仍不清楚。",
 job:["資深半導體專案工程師","💰 50,000–60,000","📍 桃竹苗／台中／雲林","🕒 08:30–17:30"],
 opening:"「你的現場管理跟包商協調經驗我都有看到，所以今天不重問整段經歷。我主要想補半導體專案深度、調派範圍跟背景條件。」",
 known:["多年工地管理","包商協調","機車駕照","建築／機電現場"],
 top:[
  ["調派","桃竹苗、台中、雲林哪些區域可以接受？","追：依專案調動的接受程度？"],
  ["半導體深度","最近半導體廠兩個月實際負責哪一塊？","追：自己負責還是協助？"],
  ["科系背景","最高學歷科系與工程技術背景？","追：機電／土木／建築相關訓練？"]
 ],
 extra:[["包商管理","有沒有直接盯進度或介面協調？"],["施工文件","查驗、施工紀錄做到什麼程度？"],["薪資","期待多少？最低接受多少？"]],
 pitch:"這個角色不是單純監工，會負責半導體廠現場的進度、品質、工程介面與包商協調，也會碰製程管線與機電系統。",
 conditions:[["薪資","50,000–60,000"],["地點","桃竹苗／台中／雲林"],["時間","08:30–17:30"],["型態","專案現場工程管理"]],
 close:"「以現在你聽到的工作內容、調派與薪資範圍，你有意願往下一步了解嗎？」",
 phone:["① 調派範圍","② 半導體責任","③ 科系背景","④ 包商／文件","⑤ 薪資","⑥ 意願"],
 flag:"半導體廠經驗只有約 2 個月，不能只看產業名稱，要確認實際責任深度。",
 evidence:"核心 Gate：調派條件、工程背景、半導體專案責任。沒有明確證據就維持待確認。"
},
safety:{
 name:"陳先生",
 chips:["現職：營造監工","4 年現場經驗","工具箱會議／巡查","來源：Threads"],
 goal:"確認職安實作深度＋承攬商管理＋虎尾派駐接受度",
 reason:"有現場底子，但要確認是否真的負責過職安管理，而不是單純配合。",
 job:["資深職業安全衛生工程師","💰 50,000–60,000","📍 雲林虎尾","🏠 全額供宿"],
 opening:"「你的現場監工經驗我有看到，所以今天不重問整段工程經歷。我主要想確認你職安管理做到多深，以及虎尾派駐的接受度。」",
 known:["4 年工地現場","做過巡查","工具箱會議","可騎機車"],
 top:[
  ["職安責任","看到不安全狀況時，你會直接要求改善還是回報職安？","追：有沒有自己做改善追蹤？"],
  ["承攬商","有沒有直接做進場管理或違規改善？","追：同時大概管理幾個包商？"],
  ["派駐","如果常駐虎尾、公司供宿，可以接受嗎？","追：後續桃竹苗／台中調派呢？"]
 ],
 extra:[["文件","入廠許可、安全表單做過嗎？"],["證照","目前有哪些職安相關證照？"],["薪資","下一份期待多少？"]],
 pitch:"這個角色會負責職安衛管理計畫、工具箱會議、入廠許可、巡查與承攬商管理。現場底子是優勢，現在主要確認你過去是不是已經實際負責職安管理。",
 conditions:[["薪資","50,000–60,000"],["地點","虎尾派駐"],["住宿","公司全額供宿"],["證照","乙級／甲種加分，非必要"]],
 close:"「如果內容是從監工延伸到真正的職安管理，公司也補助考證照，你會想往這條路發展嗎？」",
 phone:["① 職安責任","② 承攬商","③ 虎尾派駐","④ 文件／證照","⑤ 薪資","⑥ 意願"],
 flag:"做過巡查不等於具備職安管理責任；需確認要求改善、紀錄與承攬商管理。",
 evidence:"核心 Gate：3 年以上現場實務、承攬商管理／巡查、派駐條件。證照是加分，不是淘汰條件。"
}
};

function qHTML(q,i){
 return `<div class="q"><div class="title">${i+1}. ${q[0]}</div><div class="text">${q[1]}</div><details><summary>追問</summary><div class="script">${q[2]}</div></details></div>`;
}
function render(key){
 const d=DATA[key];
 document.querySelectorAll('.demo-switch button').forEach(b=>b.classList.toggle('on',b.dataset.role===key));
 document.getElementById('name').textContent=d.name;
 document.getElementById('chips').innerHTML=d.chips.map(x=>`<span class="chip">${x}</span>`).join('');
 document.getElementById('goal').textContent=d.goal;
 document.getElementById('reason').textContent=d.reason;
 document.getElementById('jobline').innerHTML=d.job.map(x=>`<span>${x}</span>`).join('');
 document.getElementById('opening').textContent=d.opening;
 document.getElementById('known').innerHTML=d.known.map(x=>`<span>✓ ${x}</span>`).join('');
 document.getElementById('top').innerHTML=d.top.map(qHTML).join('');
 document.getElementById('extra').innerHTML=d.extra.map(x=>`<div class="mini"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
 document.getElementById('pitch').textContent=d.pitch;
 document.getElementById('conditions').innerHTML=d.conditions.map(x=>`<div class="mini"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
 document.getElementById('close').textContent=d.close;
 document.getElementById('phone').innerHTML=d.phone.map(x=>`<div class="phone-item">${x}</div>`).join('');
 document.getElementById('flag').textContent=d.flag;
 document.getElementById('evidence').textContent=d.evidence;
}
document.querySelectorAll('.demo-switch button').forEach(b=>b.onclick=()=>render(b.dataset.role));
render('finance');
</script>
</body>
</html>
