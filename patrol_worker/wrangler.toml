# 2026-11-02 每日巡檢（Jacky：「每次都是我跟 Phoebe 先發現壞掉」）。
# 獨立一支 Worker，不放在後台裡面：後台本身壞掉時，巡檢還要能活著報警。
# 只讀：查 D1、用顧問後台同一支 API 看資料、抓網頁；不寫資料、不寄信、不碰 104、不開 /chat/ 連結。
name = "step1ne-patrol-worker"
main = "index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "step1ne-recruit"
database_id = "67077b4b-42d9-4086-8d04-b3658a89cffd"

# 直接接到後台 Worker（同帳號的 workers.dev 互相 fetch 會被擋，用 service binding）
[[services]]
binding = "BO"
service = "step1ne-backoffice-worker"

# "30 1 * * 1-5" = UTC 01:30 = 台北平日 09:30（Jacky 10:00 上班前）
[triggers]
crons = ["30 1 * * 1-5"]

# secrets（wrangler secret put，不寫在這裡）：
#   BO_TOKEN      後台 API 權杖（目前用舊共用鑰匙；F002 Stage B 關掉舊鑰匙前要換成具名權杖 "patrol"，
#                 沒換的話巡檢會報「後台不讓巡檢進去」，不會默默失效）
#   TG_BOT_TOKEN  Step1ne 系統 bot（~/.config/workflow-os/step1ne-tg.env）
#   RUN_KEY       部署後觸發 /run 用（~/.config/workflow-os/patrol.env 的 PATROL_RUN_KEY）
