<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Step1ne 帶案儀表板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 頁首＋三個分頁籤；每頁＝漏斗 KPI 列 → 客戶表格 → 阿財面談長條圖＋開發／新客戶 */
:root{--bg:#F3F6F7;--surface:#FFFFFF;--ink:#13232B;--muted:#5C6E78;--line:#D7E0E4;--accent:#0F6B78;--accent-soft:#D6ECEF;--warn:#B5621B;--warn-soft:#F6E6D6;--ok:#2F7A4D;--ok-soft:#DCEFE3;
--f-body:"Noto Sans TC",system-ui,sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F181C;--surface:#16232A;--ink:#E4ECEF;--muted:#93A7B0;--line:#2A3A42;--accent:#5BC0CC;--accent-soft:#163A40;--warn:#E8A06A;--warn-soft:#3A2A1C;--ok:#7FCB98;--ok-soft:#1C3527;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F181C;--surface:#16232A;--ink:#E4ECEF;--muted:#93A7B0;--line:#2A3A42;--accent:#5BC0CC;--accent-soft:#163A40;--warn:#E8A06A;--warn-soft:#3A2A1C;--ok:#7FCB98;--ok-soft:#1C3527;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font-size:26px;font-weight:900;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;min-width:0}
.step b{display:block;font-family:var(--f-num);font-size:30px;font-variant-numeric:tabular-nums}
.step span{color:var(--muted);font-size:13px}
.step i{display:block;font-style:normal;font-size:12px;color:var(--accent);margin-top:6px;font-family:var(--f-num)}
section{display:grid;gap:10px}
h2{font-size:17px;margin:0}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:940px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--bg)}
td:first-child,th:first-child,td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--bg)}
.pct{font-family:var(--f-num);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.c-客戶{background:var(--accent-soft);color:var(--accent)}.c-我們{background:var(--warn-soft);color:var(--warn)}.c-已到職{background:var(--ok-soft);color:var(--ok)}.c-洽談中{background:var(--accent-soft);color:var(--accent)}
.note{color:var(--muted);font-size:13px;white-space:normal;min-width:180px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
svg .v{fill:var(--ink);font-size:12px}
ul{margin:0;padding-left:18px;display:grid;gap:6px}
li small{color:var(--muted)}
.fine{color:var(--muted);font-size:12px}

.lk{font:inherit;color:inherit;background:none;border:0;padding:4px 6px;margin:-4px -6px;min-width:32px;min-height:32px;border-radius:6px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lk:hover{background:var(--accent-soft);color:var(--accent)}.lk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lk.cl{font-weight:700;text-decoration-color:var(--accent)}
.lk[disabled]{text-decoration:none;cursor:default;color:var(--muted);background:none}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(1320px,calc(100vw - 48px));max-height:94vh}
dialog::backdrop{background:rgba(10,20,25,.45)}
.dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dh h3{margin:0;font-size:17px;flex:1}
.dh button{font:inherit;min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.db{padding:14px 16px;overflow:auto}
.db table{min-width:560px}
.db ol{margin:0;padding-left:22px;display:grid;gap:6px}
.db .jt{font-weight:700;margin:14px 0 6px}.db .jt:first-child{margin-top:0}
.rts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;min-width:220px}
.rts span{display:flex;flex-direction:column;align-items:center;background:var(--accent-soft);border-radius:8px;padding:4px 6px}
.rts small{font-size:11px;color:var(--muted);font-weight:400}.rts b{font-family:var(--f-num);font-size:14px;color:var(--accent)}
.db>.rts span{padding:8px 6px}.db>.rts b{font-size:18px}
@media (min-width:641px){.db td,.db th{padding:7px 10px;font-size:14px}.db .tw{overflow-x:visible}.db table{min-width:0}.db td{white-space:normal}}
@media (max-width:760px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:640px){
h1{font-size:22px}.tabs{gap:6px}.tabs button{flex:1;padding:0 8px}
.funnel{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.funnel .step{border:0;border-radius:0;padding:12px 10px;border-top:1px solid var(--line)}
.funnel .step:nth-child(-n+3){border-top:0}.funnel .step:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.step b{font-size:24px}.step span{font-size:12px}.step i{font-size:11px}
.tw.cards{background:none;border:0;overflow:visible;border-radius:0}
.cards table,.cards tbody,.cards tfoot{display:block;width:100%;min-width:0}.cards thead{display:none}
.cards tbody tr,.cards tfoot tr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px 0;padding:14px 2px;border-bottom:1px solid var(--line)}
.cards tfoot tr{border-bottom:0;border-top:2px solid var(--ink);margin-top:2px}
.cards tfoot td:first-child{grid-column:1/-1}
.cards td{grid-column:span 2;display:flex;flex-direction:column-reverse;align-items:center;gap:0;border:0;padding:0;background:none;white-space:normal;min-width:0;text-align:center;font-size:17px;font-weight:700}
.cards td::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:400}
.cards td[data-label="職缺"],.cards td[data-label="推薦中"]{display:none}
.cards td.pct{grid-column:span 3;order:1;flex-direction:row;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 2px;margin-top:6px;border-left:2px solid var(--surface)}
.cards td.pct::before{font-size:11px;color:var(--muted)}
.cards td:first-child{grid-column:1/9;order:-2;flex-direction:row;justify-content:flex-start;font-size:16px;text-align:left}
.cards td:first-child::before,.cards td:has(.chip)::before{display:none}
.cards td:has(.chip){grid-column:9/13;order:-1;flex-direction:row;justify-content:flex-end}
.cards td.note{grid-column:1/-1;order:2;font-size:13px;font-weight:400;align-items:flex-start;text-align:left;margin-top:4px}
.cards td.note::before{display:none}.cards td:empty{display:none}
.cards td:is([data-label="面談完成"],[data-label="推薦"],[data-label="客戶面試"],[data-label="錄取"],[data-label="到職"]){border-left:1px solid var(--line)}
.cards .lk{margin:0;padding:2px 0;min-height:36px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--accent)}
.cards .lk[disabled]{color:var(--muted);font-weight:400}
.cards .lk.cl{width:auto;justify-content:flex-start;color:var(--ink)}
.cards .lk.cl::after{content:"›";margin-left:6px;color:var(--muted);font-weight:400}
dialog{width:calc(100vw - 16px);max-width:calc(100vw - 16px);max-height:80vh;margin:auto;border-radius:16px}
.db .cards tbody tr{grid-template-columns:repeat(6,minmax(0,1fr))}
.db .cards td:first-child{grid-column:1/-1;font-size:15px;display:flex}
.db .cards td[data-label="推薦中"]{display:none}
.db .cards td.rtd{grid-column:1/-1;order:2;display:block;margin-top:8px}.db .cards td.rtd::before{display:none}
.db .cards td:first-child .lk{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl select{font:inherit;font-weight:700;min-height:44px;padding:0 36px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:700;min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg button:focus-visible,.ctl select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dl{display:block;font-style:normal;font-size:12px;margin-top:2px;font-family:var(--f-num)}
.up{color:var(--ok)}.dn{color:var(--warn)}.eq{color:var(--muted)}
.state{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.state.f{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.sec{display:inline-flex;border-bottom:2px solid var(--line);gap:4px;flex-wrap:wrap}
.sec button{font:inherit;font-weight:700;min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.sec button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sec button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec small{font-weight:400;color:var(--muted);margin-left:4px}
.stg{display:flex;flex-wrap:wrap;gap:6px}
.stg span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.stg b{font-family:var(--f-num);margin-left:4px;color:var(--accent)}
.wk{display:block;font-size:11.5px;color:var(--muted)}
.bdl{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bdi{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.bdi:last-child{border-bottom:0}
.bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bh .lk.cl{font-size:16px}
.bh small{color:var(--muted);margin-left:auto}
.hot{font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 7px}
.bl{font-size:13px;color:var(--muted)}
.bn{font-size:13px}
.bn b{color:var(--accent);font-weight:700}
.tch{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center}
.tch span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tch svg{width:14px;height:14px;flex:none;color:var(--accent)}
.tch b{font-family:var(--f-num);color:var(--ink);font-weight:500}
.tch i{font-style:normal;font-size:12px}.tch i.on{color:var(--accent);font-weight:700}
.cdl{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.cdl b{color:var(--ink);font-weight:500}
.st-已開職缺,.st-談需求{background:var(--ok-soft);color:var(--ok)}.st-有興趣{background:var(--warn-soft);color:var(--warn)}
.st-已寄資料,.st-拿到窗口,.st-已聯繫{background:var(--accent-soft);color:var(--accent)}.st-未聯繫{background:var(--bg);color:var(--muted)}
@media (max-width:640px){.bdi{padding:12px 4px}.bdl{background:none;border:0;border-radius:0;border-top:1px solid var(--line)}.bh small{margin-left:0;width:100%}}
.clp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.clp.cut{cursor:pointer}.clp.cut:hover{color:var(--accent)}.clp.open{display:block;-webkit-line-clamp:unset;overflow:visible}
@media (min-width:641px){.bdt table{table-layout:fixed;width:100%;min-width:0}.bdt th,.bdt td{padding:9px 8px;font-size:14px;white-space:normal;overflow-wrap:anywhere}.bdt th:nth-child(1){width:15%}.bdt th:nth-child(2){width:9%}.bdt th:nth-child(3){width:10%}.bdt th:nth-child(4){width:14%}.bdt th:nth-child(5){width:12%}.bdt th:nth-child(6){width:18%}.bdt th:nth-child(7){width:15%}.bdt th:nth-child(8){width:7%}.bdt .lk.cl{white-space:normal;text-align:left}}
.bdt td{vertical-align:top}
.db .pst{min-width:0}.db .pst td:first-child{font-weight:700;white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:640px){
/* 每一格固定在哪一行：名稱／球在誰＝第1行、人數＝第2行、比率＝第3行、說明＝第4行（舊週沒有「球在誰」也不會往上擠） */
.cards tbody td,.cards tfoot td{grid-row:2}
.cards tbody td:first-child,.cards tfoot td:first-child,.cards td:has(.chip){grid-row:1}
.cards tbody td.pct,.cards tfoot td.pct{grid-row:3}
.cards tbody td.note{grid-row:4}
.db .cards td.rtd{grid-row:3}
.bdt.cards tbody tr{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 0}
.bdt.cards tbody td{grid-row:auto;grid-column:1/-1;flex-direction:row;align-items:baseline;justify-content:flex-start;text-align:left;gap:8px;font-size:14px;font-weight:400;line-height:1.5}
.bdt.cards tbody td::before{flex:0 0 5.5em;font-size:12px}
.bdt.cards tbody td:first-child{grid-row:1;grid-column:1/5;font-size:16px;font-weight:700}
.bdt.cards tbody td:has(.chip){grid-row:1;grid-column:5/7;justify-content:flex-end}
.bdt.cards tbody td:is([data-label="寄信"],[data-label="電話"]){grid-column:span 3;flex-direction:column-reverse;align-items:center;text-align:center;gap:0;font-size:17px;font-weight:700;background:var(--accent-soft);padding:6px 2px;border-left:2px solid var(--surface)}
.bdt.cards tbody td:is([data-label="寄信"],[data-label="電話"])::before{flex:none}

}
</style></head><body>
<div class="wrap">
<header><h1>Step1ne 帶案狀況</h1><p class="sub" id="sub"></p></header>
<div class="ctl"><select id="wk" aria-label="選擇週次"></select>
<div class="seg" role="group" aria-label="看哪一種數字"><button id="v-new" aria-pressed="true">這週新增</button><button id="v-cum" aria-pressed="false">累計到這週</button></div></div>
<div class="tabs" role="tablist">
<button role="tab" data-t="all" aria-selected="true">全部</button><button role="tab" data-t="jacky" aria-selected="false">Jacky</button><button role="tab" data-t="phoebe" aria-selected="false">Phoebe</button></div>
<div class="sec" role="tablist" aria-label="客戶類別"><button role="tab" id="s-sig" aria-selected="true">已簽約客戶招募</button><button role="tab" id="s-bd" aria-selected="false">未簽約開發客戶</button></div>
<div class="funnel" id="funnel"></div>
<section><div id="sigbox"><h2 id="th" style="margin:6px 0 10px">各客戶人選狀況</h2>
<div class="tw cards"><table><thead><tr><th class="l">客戶</th><th>職缺</th><th>應徵</th><th>面談完成</th><th>推薦</th><th>推薦中</th><th>客戶面試</th><th>錄取</th><th>到職</th><th>推薦率</th><th>面試率</th><th>錄取率</th><th>報到率</th><th class="l">球在誰</th><th class="l">說明</th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div>
<p class="fine" id="fine"></p></div><div id="bdbox" hidden></div></section>
<div class="two">
<section class="card"><h2>每週趨勢（這週新增）</h2><div id="trend"></div><p class="fine">灰：應徵｜淺色：阿財面談完成｜深色：推薦。框起來的是目前選的那週。</p></section>
<section class="card"><h2 id="dh">阿財每日面談完成數</h2><div id="chart"></div><p class="fine" id="wkn"></p></section>
</div>
<div>
<section class="card"><h2>Email 推薦（系統外）</h2><ul id="email"></ul><h2 style="margin-top:12px">新客戶</h2><ul id="newc"></ul></section>
</div>
</div>
<dialog id="dlg" aria-labelledby="dlgt"><div class="dh"><button id="back" aria-label="回上一層" hidden>‹</button><h3 id="dlgt"></h3><button id="x" aria-label="關閉">✕</button></div><div class="db" id="dlgb"></div></dialog>
<script>
const S=/*__DATA__*/null;
const W=S.weeks; // 新到舊
const st={tab:'all',wi:0,view:'new',sec:'sig'};
try{const q=JSON.parse(localStorage.getItem('pdash')||'{}');if(q.tab)st.tab=q.tab;if(q.view)st.view=q.view;if(q.sec)st.sec=q.sec}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.min(100,Math.round(a*100/b))+'%':'—';
const KN={app:'應徵',iv:'面談完成',fw:'推薦',active:'推薦中',ci:'客戶面試',of:'錄取',on:'到職'};
const TN={all:'全部',jacky:'Jacky',phoebe:'Phoebe'};
const K=['app','iv','fw','active','ci','of','on'];
const wkLabel=(w,i)=>i===0&&!w.frozen?`本週 ${w.label}（每天更新）`:`${w.label}（已封存）`;
function view(w,v){return (w&&w[v])?w[v][st.tab]:null}
function tot(rows){const T={jobs:0};K.forEach(k=>T[k]=0);(rows||[]).forEach(r=>{T.jobs+=r.jobs;K.forEach(k=>T[k]+=r[k])});return T}
let DLW='比上週';function dl(a,b){if(b==null)return '';const d=a-b;return d>0?`<span class="dl up">${DLW} +${d}</span>`:d<0?`<span class="dl dn">${DLW} ${d}</span>`:`<span class="dl eq">${DLW} 持平</span>`}
function lab(root){root.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr,tfoot tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.setAttribute('data-label',hs[i]||'')))})}
function render(){
  const w=W[st.wi],prev=W[st.wi+1];
  if(st.view==='cum'&&!w.cum)st.view='new';
  $('v-cum').disabled=!w.cum;$('v-new').setAttribute('aria-pressed',st.view==='new');$('v-cum').setAttribute('aria-pressed',st.view==='cum');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===st.tab));
  const ov=w.ov||(W.find(x=>x.ov)||{}).ov||{};
  $('sub').innerHTML=`${w.label}｜${st.view==='new'?'這週發生的事':'從開始到這週的總數'}｜資料更新 ${esc(w.upd)} <span class="state ${w.frozen?'f':''}">${w.frozen?'已封存':'每天更新中'}</span>`;

 let P=null;if(!isCum){P=same?(w.bd_prev_same||{})[st.tab]:(prev&&prev.bd&&prev.bd[st.tab]?prev.bd[st.tab].new.kpi:null)}else if(prev&&prev.bd&&prev.bd[st.tab]&&prev.bd[st.tab].cum){P=prev.bd[st.tab].cum.kpi}

 BDL=V.list;
