name = "step1ne-recruit-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "step1ne-recruit"
database_id = "67077b4b-42d9-4086-8d04-b3658a89cffd"

# 提醒排程：每 15 分鐘檢查一次。面談前 15 分鐘那則要準時，
# 間隔拉長會漏掉。
[triggers]
crons = ["*/15 * * * *"]

# ADMIN_TOKEN / TG_BOT_TOKEN / TG_CHAT_ID 用 wrangler secret put 設定，不寫在這裡

# 語音口說驗證用 Workers AI 的 Whisper 做轉寫。
# 為什麼選這個：我們已經在 Cloudflare 上，不必再申請一把 OpenAI 金鑰、
# 也不必把候選人的錄音送到第三方——音檔在同一個帳號裡處理完就好。
[ai]
binding = "AI"

# 2026-09-03加：履歷/上傳檔案改用R2物件儲存（原本存D1的files/file_chunks，
# 一份履歷要切好幾個chunk塞進SQLite，既佔空間又慢）。三個Worker
# （這裡＋step1ne-public-worker＋step1ne-backoffice-worker）都要綁同一個桶，
# 因為saveResume/saveUpload/fileB64這三支函式在三邊都各自複製了一份。
[[r2_buckets]]
binding = "FILES"
bucket_name = "step1ne-files"

# 2026-09-18 加：阿財 P3 的功能旗標。設 "1" 才啟用，其他值（含未設定）一律視為關閉。
# 做成旗標而不是直接上線，是為了能一個一個打開、每個觀察一天，
# 出問題時可以只關掉那一條而不是整批停擺。
#   P3_IDLE_NUDGE_ENABLED      面談中斷超過 24 小時 → LINE 催候選人一次
#   P3_FOLLOWUP_REMINDER_ENABLED  候選人約定的追蹤日期到期 → TG 提醒顧問（不碰候選人）
[vars]
P3_IDLE_NUDGE_ENABLED = "1"
P3_FOLLOWUP_REMINDER_ENABLED = "1"
